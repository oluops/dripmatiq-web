<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9b45b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d4a8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric pattern -->
  <g opacity="0.03">
    <rect x="100" y="100" width="200" height="200" fill="#d9b45b" rx="10"/>
    <rect x="900" y="330" width="150" height="150" fill="#d9b45b" rx="10" transform="rotate(45 975 405)"/>
    <circle cx="600" cy="315" r="300" fill="none" stroke="#d9b45b" stroke-width="1"/>
  </g>
  
  <!-- Phone frame -->
  <g transform="translate(150, 80)">
    <!-- Phone body -->
    <rect x="0" y="0" width="320" height="570" rx="40" fill="#1a1a1a" stroke="#333" stroke-width="4"/>
    <rect x="8" y="8" width="304" height="554" rx="34" fill="#0a0a0a"/>
    
    <!-- Dynamic island -->
    <rect x="100" y="12" width="120" height="30" rx="15" fill="#000"/>
    
    <!-- App content -->
    <g transform="translate(20, 60)">
      <!-- Header -->
      <text x="142" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" fill="#fff" text-anchor="middle">Dripmatiq</text>
      <text x="142" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#888" text-anchor="middle">Today's Pick</text>
      
      <!-- Outfit card -->
      <rect x="10" y="70" width="264" height="320" rx="16" fill="#151515" filter="url(#glow)"/>
      
      <!-- Outfit items -->
      <g transform="translate(20, 90)">
        <!-- Top -->
        <rect x="0" y="0" width="100" height="80" rx="8" fill="url(#goldGradient)" opacity="0.9"/>
        <text x="50" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#0a0a0a" text-anchor="middle">Silk Blouse</text>
        
        <!-- Bottom -->
        <rect x="120" y="0" width="100" height="80" rx="8" fill="#2a2a2a" stroke="#d9b45b" stroke-width="1"/>
        <text x="170" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#d9b45b" text-anchor="middle">Wide Trouser</text>
        
        <!-- Layer -->
        <rect x="0" y="100" width="100" height="80" rx="8" fill="#2a2a2a" stroke="#333" stroke-width="1"/>
        <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#fff" text-anchor="middle">Blazer</text>
        
        <!-- Shoes -->
        <rect x="120" y="100" width="100" height="80" rx="8" fill="#d9b45b" opacity="0.3"/>
        <text x="170" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#d9b45b" text-anchor="middle">Loafers</text>
      </g>
      
      <!-- Weather/Context bar -->
      <rect x="10" y="410" width="264" height="50" rx="10" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <g transform="translate(20, 420)">
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#d9b45b">72°F ☀️  Client Meeting</text>
      </g>
      
      <!-- Action button -->
      <rect x="32" y="480" width="200" height="48" rx="24" fill="url(#goldGradient)"/>
      <text x="132" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0a0a0a" text-anchor="middle">Wear This</text>
      
      <!-- Time saved indicator -->
      <text x="142" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="300" fill="#666" text-anchor="middle">Saved 14 min this morning</text>
    </g>
  </g>
  
  <!-- Right side content -->
  <g transform="translate(550, 120)">
    <!-- Main headline -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="200" fill="#fff" letter-spacing="-1">
      <tspan fill="url(#goldGradient)">Get Dressed</tspan>
      <tspan x="0" dy="55">Faster</tspan>
    </text>
    
    <!-- Sub headline -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" fill="#aaa" letter-spacing="-0.5">
      AI picks your outfit in 60 seconds.
    </text>
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" fill="#aaa" letter-spacing="-0.5">
      You save 14 minutes every morning.
    </text>
    
    <!-- Stats -->
    <g transform="translate(0, 220)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#goldGradient)">14 min</text>
        <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#666">saved daily</text>
      </g>
      <g transform="translate(180, 0)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#goldGradient)">84 hrs</text>
        <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#666">returned yearly</text>
      </g>
      <g transform="translate(360, 0)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="url(#goldGradient)">30%+</text>
        <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#666">more wardrobe used</text>
      </g>
    </g>
    
    <!-- Feature highlights -->
    <g transform="translate(0, 320)">
      <g transform="translate(0, 0)">
        <circle cx="16" cy="16" r="16" fill="url(#goldGradient)" opacity="0.2"/>
        <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#d9b45b" text-anchor="middle">⚡</text>
        <text x="50" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#fff">Weather-aware</text>
        <text x="50" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#888">Real-time temp & precip</text>
      </g>
      <g transform="translate(0, 55)">
        <circle cx="16" cy="16" r="16" fill="url(#goldGradient)" opacity="0.2"/>
        <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#d9b45b" text-anchor="middle">📅</text>
        <text x="50" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#fff">Calendar sync</text>
        <text x="50" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#888">Meeting-aware outfits</text>
      </g>
      <g transform="translate(0, 110)">
        <circle cx="16" cy="16" r="16" fill="url(#goldGradient)" opacity="0.2"/>
        <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#d9b45b" text-anchor="middle">🧠</text>
        <text x="50" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#fff">Learns your style</text>
        <text x="50" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#888">Feedback loop improves picks</text>
      </g>
      <g transform="translate(0, 165)">
        <circle cx="16" cy="16" r="16" fill="url(#goldGradient)" opacity="0.2"/>
        <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#d9b45b" text-anchor="middle">♻️</text>
        <text x="50" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#fff">Zero upsells</text>
        <text x="50" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#888">Styles what you own</text>
      </g>
    </g>
    
    <!-- CTA -->
    <g transform="translate(0, 520)">
      <rect x="0" y="0" width="280" height="56" rx="28" fill="url(#goldGradient)"/>
      <text x="140" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#0a0a0a" text-anchor="middle">Download Dripmatiq</text>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.05">
    <circle cx="1100" cy="50" r="80" fill="#d9b45b"/>
    <circle cx="50" cy="580" r="60" fill="#d9b45b"/>
  </g>
</svg>