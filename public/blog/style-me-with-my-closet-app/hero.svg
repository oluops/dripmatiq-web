<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- iPhone mockup -->
  <g transform="translate(600,315)">
    <rect x="-180" y="-360" width="360" height="720" rx="30" fill="url(#phoneGrad)" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="-160" y="-340" width="320" height="680" rx="20" fill="#f9fafb"/>
    <!-- App interface -->
    <rect x="-140" y="-310" width="280" height="40" rx="8" fill="#6366f1"/>
    <text x="0" y="-285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Dripmatiq</text>
    <!-- Clothing items grid -->
    <g transform="translate(0, -250)">
      <rect x="-120" y="0" width="110" height="150" rx="8" fill="#ef4444" opacity="0.9"/>
      <rect x="10" y="0" width="110" height="150" rx="8" fill="#3b82f6" opacity="0.9"/>
      <rect x="-120" y="170" width="110" height="150" rx="8" fill="#10b981" opacity="0.9"/>
      <rect x="10" y="170" width="110" height="150" rx="8" fill="#f59e0b" opacity="0.9"/>
      <rect x="-55" y="340" width="110" height="150" rx="8" fill="#8b5cf6" opacity="0.9"/>
    </g>
    <!-- AI sparkle indicator -->
    <circle cx="130" cy="-290" r="18" fill="#fbbf24" opacity="0.9"/>
    <text x="130" y="-285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">*</text>
    <!-- Generate button -->
    <rect x="-80" y="280" width="160" height="48" rx="24" fill="#6366f1"/>
    <text x="0" y="308" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Style Me</text>
  </g>
  <text x="600" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">
    Style Me With My Closet App
  </text>
  <text x="600" y="560" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" opacity="0.9">
    AI-Powered Outfit Generator from Your Own Clothes
  </text>
</svg>