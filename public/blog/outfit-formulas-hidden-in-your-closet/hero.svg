<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Flat lay showing formula components: structured blazer, neutral tee, tailored trousers, loafers arranged as a reusable template, dark background with gold accents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3D3310" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F2D27A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldline)"/>

  <text x="80" y="80" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#F2D27A" letter-spacing="2.5">DRIPMATIQ JOURNAL</text>
  <line x1="80" y1="95" x2="380" y2="95" stroke="url(#goldline)" stroke-width="2" stroke-linecap="round"/>

  <text x="80" y="170" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700" fill="#F7F4EC" letter-spacing="0.2" style="line-height: 1.15">Outfit Formulas</text>
  <text x="80" y="230" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700" fill="#F7F4EC" letter-spacing="0.2" style="line-height: 1.15">Hidden in Your Closet</text>

  <text x="80" y="300" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#B8C0D8" letter-spacing="0.3">Five structures. Fifty-four outfits. Zero new clothes.</text>

  <g transform="translate(700, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="550" rx="40" fill="#0D1117" stroke="#1F2A3A" stroke-width="3"/>
    <rect x="150" y="8" width="120" height="6" rx="3" fill="#1F2A3A"/>
    <rect x="12" y="30" width="396" height="508" rx="28" fill="#0A0A0A"/>

    <g transform="translate(24, 40)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2D27A">Your Formula Library</text>
      
      <g transform="translate(0, 30)">
        <!-- Formula 1 -->
        <rect x="0" y="0" width="360" height="90" rx="10" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="16" y="28" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2D27A">Formula 1 — The Anchor</text>
        <text x="16" y="50" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B8C0D8">Statement piece + quiet supporters</text>
        <text x="16" y="70" font-family="Inter, Arial, sans-serif" font-size="10" fill="#D4AF37">12 variants in your closet</text>

        <!-- Formula 2 -->
        <rect x="0" y="105" width="360" height="90" rx="10" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="16" y="133" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2D27A">Formula 2 — The Uniform</text>
        <text x="16" y="155" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B8C0D8">Consistent categories, rotating shoes</text>
        <text x="16" y="175" font-family="Inter, Arial, sans-serif" font-size="10" fill="#D4AF37">18 variants in your closet</text>

        <!-- Formula 3 -->
        <rect x="0" y="210" width="360" height="90" rx="10" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="16" y="238" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2D27A">Formula 3 — Dress-Up/Down</text>
        <text x="16" y="260" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B8C0D8">One dress, two contexts</text>
        <text x="16" y="280" font-family="Inter, Arial, sans-serif" font-size="10" fill="#D4AF37">8 variants in your closet</text>

        <!-- Formula 4 -->
        <rect x="0" y="315" width="360" height="90" rx="10" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="16" y="343" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2D27A">Formula 4 — The Layer Stack</text>
        <text x="16" y="365" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B8C0D8">Base + mid + outer + bottom + shoe</text>
        <text x="16" y="385" font-family="Inter, Arial, sans-serif" font-size="10" fill="#D4AF37">15 variants in your closet</text>

        <!-- Formula 5 -->
        <rect x="0" y="420" width="360" height="90" rx="10" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="16" y="448" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2D27A">Formula 5 — Third Piece</text>
        <text x="16" y="470" font-family="Inter, Arial, sans-serif" font-size="11" fill="#B8C0D8">Top + bottom + completer</text>
        <text x="16" y="490" font-family="Inter, Arial, sans-serif" font-size="10" fill="#D4AF37">11 variants in your closet</text>
      </g>
    </g>
  </g>

  <circle cx="100" cy="420" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="140" cy="440" r="2" fill="#F2D27A" opacity="0.4"/>
  <circle cx="80" cy="460" r="2.5" fill="#D4AF37" opacity="0.5"/>
  <circle cx="120" cy="480" r="1.5" fill="#F2D27A" opacity="0.3"/>

  <text x="80" y="580" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#B8C0D8" letter-spacing="2">DRIPMATIQ.APP</text>
  <rect x="0" y="626" width="1200" height="4" fill="url(#goldline)"/>
</svg>