  <text x="900" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#888" text-anchor="middle">20 core pieces · 5 formulas · 0 duplicates</text>
  
  <!-- Formula cards -->
  <g id="formula-cards">
    <!-- Formula 1 -->
    <g transform="translate(650, 110)">
      <rect x="0" y="0" width="260" height="90" fill="#1a1a1a" stroke="#d9b45b" stroke-width="1" rx="8"/>
      <text x="130" y="22" font-family="system-ui" font-size="13" font-weight="500" fill="#d9b45b" text-anchor="middle">Formula 1</text>
      <text x="130" y="40" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle">"WFH grocery run"</text>
      <text x="130" y="58" font-family="system-ui" font-size="10" fill="#aaa" text-anchor="middle">merino tee · joggers · white sneakers</text>
      <text x="130" y="78" font-family="system-ui" font-size="10" fill="#d9b45b" text-anchor="middle">Worn 3× this week</text>
    </g>
    
    <!-- Formula 2 -->
    <g transform="translate(650, 215)">
      <rect x="0" y="0" width="260" height="90" fill="#1a1a1a" stroke="#d9b45b" stroke-width="1" rx="8"/>
      <text x="130" y="22" font-family="system-ui" font-size="13" font-weight="500" fill="#d9b45b" text-anchor="middle">Formula 2</text>
      <text x="130" y="40" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle">"Rain commute + office"</text>
      <text x="130" y="58" font-family="system-ui" font-size="10" fill="#aaa" text-anchor="middle">trench · merino base · jeans · boots</text>
      <text x="130" y="78" font-family="system-ui" font-size="10" fill="#d9b45b" text-anchor="middle">Saved Tuesday</text>
    </g>
    
    <!-- Formula 3 -->
    <g transform="translate(650, 320)">
      <rect x="0" y="0" width="260" height="90" fill="#1a1a1a" stroke="#d9b45b" stroke-width="1" rx="8"/>
      <text x="130" y="22" font-family="system-ui" font-size="13" font-weight="500" fill="#d9b45b" text-anchor="middle">Formula 3</text>
      <text x="130" y="40" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle">"Client dinner"</text>
      <text x="130" y="58" font-family="system-ui" font-size="10" fill="#aaa" text-anchor="middle">navy cashmere · silk cami · trousers · heels</text>
      <text x="130" y="78" font-family="system-ui" font-size="10" fill="#d9b45b" text-anchor="middle">Elevated</text>
    </g>
    
    <!-- Formula 4 -->
    <g transform="translate(650, 425)">
      <rect x="0" y="0" width="260" height="90" fill="#1a1a1a" stroke="#d9b45b" stroke-width="1" rx="8"/>
      <text x="130" y="22" font-family="system-ui" font-size="13" font-weight="500" fill="#d9b45b" text-anchor="middle">Formula 4</text>
      <text x="130" y="40" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle">"Travel walking day"</text>
      <text x="130" y="58" font-family="system-ui" font-size="10" fill="#aaa" text-anchor="middle">rain shell · merino · chinos · sneakers</text>
      <text x="130" y="78" font-family="system-ui" font-size="10" fill="#d9b45b" text-anchor="middle">Packed Thursday</text>
    </g>
    
    <!-- Formula 5 -->
    <g transform="translate(650, 530)">
      <rect x="0" y="0" width="260" height="90" fill="#1a1a1a" stroke="#d9b45b" stroke-width="1" rx="8"/>
      <text x="130" y="22" font-family="system-ui" font-size="13" font-weight="500" fill="#d9b45b" text-anchor="middle">Formula 5</text>
      <text x="130" y="40" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle">"Date night"</text>
      <text x="130" y="58" font-family="system-ui" font-size="10" fill="#aaa" text-anchor="middle">rust knit · midi skirt · ankle boots</text>
      <text x="130" y="78" font-family="system-ui" font-size="10" fill="#d9b45b" text-anchor="middle">Cozy intentional</text>
    </g>
  </g>
  
  <!-- Bottom metrics -->
  <g transform="translate(150, 550)">
    <text x="0" y="0" font-family="system-ui" font-size="11" fill="#d9b45b">43 hrs/yr → 2 hrs/yr</text>
    <text x="0" y="18" font-family="system-ui" font-size="11" fill="#d9b45b">$2,800/yr → ~$0</text>
    <text x="0" y="36" font-family="system-ui" font-size="11" fill="#d9b45b">Decision fatigue → GONE</text>
    <text x="0" y="54" font-family="system-ui" font-size="11" fill="#ff6b6b">Duplicates → ZERO</text>
  </g>
