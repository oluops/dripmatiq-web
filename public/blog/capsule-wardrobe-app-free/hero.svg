<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mobile capsule wardrobe app showing 30-item closet generating 100+ outfit combinations, dark background with gold accents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3D3310" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F2D27A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldline)"/>

  <text x="80" y="80" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#F2D27A" letter-spacing="2.5">DRIPMATIQ JOURNAL</text>
  <line x1="80" y1="95" x2="380" y2="95" stroke="url(#goldline)" stroke-width="2" stroke-linecap="round"/>

  <text x="80" y="170" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700" fill="#F7F4EC" letter-spacing="0.2" style="line-height: 1.15">Free Capsule</text>
  <text x="80" y="230" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700" fill="#F7F4EC" letter-spacing="0.2" style="line-height: 1.15">Wardrobe App</text>

  <text x="80" y="300" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#B8C0D8" letter-spacing="0.3">30 items. 100+ combos. Zero subscriptions.</text>

  <g transform="translate(700, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="550" rx="40" fill="#0D1117" stroke="#1F2A3A" stroke-width="3"/>
    <rect x="150" y="8" width="120" height="6" rx="3" fill="#1F2A3A"/>
    <rect x="12" y="30" width="396" height="508" rx="28" fill="#0A0A0A"/>

    <g transform="translate(24, 40)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2D27A">Your Capsule: 30 Pieces</text>
      
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="115" height="150" rx="8" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="10" y="25" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F7F4EC" text-anchor="middle">Tops</text>
        <text x="10" y="45" font-family="Inter, Arial, sans-serif" font-size="10" fill="#B8C0D8" text-anchor="middle">8 items</text>
      </g>
      <g transform="translate(125, 35)">
        <rect x="0" y="0" width="115" height="150" rx="8" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="10" y="25" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F7F4EC" text-anchor="middle">Bottoms</text>
        <text x="10" y="45" font-family="Inter, Arial, sans-serif" font-size="10" fill="#B8C0D8" text-anchor="middle">7 items</text>
      </g>
      <g transform="translate(250, 35)">
        <rect x="0" y="0" width="115" height="150" rx="8" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="10" y="25" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F7F4EC" text-anchor="middle">Layers</text>
        <text x="10" y="45" font-family="Inter, Arial, sans-serif" font-size="10" fill="#B8C0D8" text-anchor="middle">5 items</text>
      </g>

      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="115" height="150" rx="8" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="10" y="25" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F7F4EC" text-anchor="middle">Shoes</text>
        <text x="10" y="45" font-family="Inter, Arial, sans-serif" font-size="10" fill="#B8C0D8" text-anchor="middle">5 items</text>
      </g>
      <g transform="translate(125, 210)">
        <rect x="0" y="0" width="115" height="150" rx="8" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="10" y="25" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F7F4EC" text-anchor="middle">Dresses</text>
        <text x="10" y="45" font-family="Inter, Arial, sans-serif" font-size="10" fill="#B8C0D8" text-anchor="middle">3 items</text>
      </g>
      <g transform="translate(250, 210)">
        <rect x="0" y="0" width="115" height="150" rx="8" fill="#141820" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="10" y="25" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F7F4EC" text-anchor="middle">Access.</text>
        <text x="10" y="45" font-family="Inter, Arial, sans-serif" font-size="10" fill="#B8C0D8" text-anchor="middle">2 items</text>
      </g>

      <rect x="0" y="385" width="360" height="80" rx="12" fill="#1E2530" stroke="#D4AF37" stroke-width="2"/>
      <text x="180" y="422" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2D27A" text-anchor="middle">100+ Outfit Combos</text>
      <text x="180" y="445" font-family="Inter, Arial, sans-serif" font-size="12" fill="#B8C0D8" text-anchor="middle">All from your 30 pieces</text>
    </g>
  </g>

  <circle cx="100" cy="420" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="140" cy="440" r="2" fill="#F2D27A" opacity="0.4"/>
  <circle cx="80" cy="460" r="2.5" fill="#D4AF37" opacity="0.5"/>
  <circle cx="120" cy="480" r="1.5" fill="#F2D27A" opacity="0.3"/>

  <text x="80" y="580" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#B8C0D8" letter-spacing="2">DRIPMATIQ.APP</text>
  <rect x="0" y="626" width="1200" height="4" fill="url(#goldline)"/>
</svg>