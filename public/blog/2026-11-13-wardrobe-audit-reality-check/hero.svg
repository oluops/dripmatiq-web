      <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">WORN REGULARLY</text>
      
      <text x="260" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#d9b45b">85%</text>
      <text x="260" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">INVISIBLE</text>
      
      <text x="420" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#666">$2.8K</text>
      <text x="420" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">IMPULSE SPEND/YR</text>
    </g>
  </g>
  
  <!-- Divider -->
