          <text x="20" y="28" font-size="15" font-weight="500" fill="#d9b45b">FORMULA 1</text>
          <text x="20" y="52" font-size="14" font-weight="300" fill="#ccc">"WFH grocery run" — merino tee, joggers, white sneakers</text>
          <text x="440" y="52" font-size="13" font-weight="400" fill="#d9b45b" text-anchor="end">3× this week</text>
        </g>
        
        <!-- Formula 2 -->
        <g transform="translate(20, 90)">
          <rect x="0" y="0" width="480" height="75" rx="8" fill="#141414" stroke="#d9b45b" stroke-width="1.5" filter="url(#softGlow)"/>
          <text x="20" y="28" font-size="15" font-weight="500" fill="#d9b45b">FORMULA 2</text>
          <text x="20" y="52" font-size="14" font-weight="300" fill="#ccc">"Rain commute + office" — trench, merino base, jeans, ankle boots</text>
          <text x="440" y="52" font-size="13" font-weight="400" fill="#d9b45b" text-anchor="end">saved Tue</text>
        </g>
        
        <!-- Formula 3 -->
        <g transform="translate(20, 180)">
          <rect x="0" y="0" width="480" height="75" rx="8" fill="#141414" stroke="#d9b45b" stroke-width="1.5" filter="url(#softGlow)"/>
          <text x="20" y="28" font-size="15" font-weight="500" fill="#d9b45b">FORMULA 3</text>
          <text x="20" y="52" font-size="14" font-weight="300" fill="#ccc">"Client dinner" — navy cashmere, silk cami, trousers, heels</text>
          <text x="440" y="52" font-size="13" font-weight="400" fill="#d9b45b" text-anchor="end">elevated</text>
        </g>
        
        <!-- Formula 4 -->
        <g transform="translate(20, 270)">
          <rect x="0" y="0" width="480" height="75" rx="8" fill="#141414" stroke="#d9b45b" stroke-width="1.5" filter="url(#softGlow)"/>
          <text x="20" y="28" font-size="15" font-weight="500" fill="#d9b45b">FORMULA 4</text>
          <text x="20" y="52" font-size="14" font-weight="300" fill="#ccc">"Travel walking day" — rain shell, merino tee, chinos, sneakers</text>
          <text x="440" y="52" font-size="13" font-weight="400" fill="#d9b45b" text-anchor="end">packed Thu</text>
        </g>
        
        <!-- Formula 5 -->
        <g transform="translate(20, 360)">
          <rect x="0" y="0" width="480" height="75" rx="8" fill="#141414" stroke="#d9b45b" stroke-width="1.5" filter="url(#softGlow)"/>
          <text x="20" y="28" font-size="15" font-weight="500" fill="#d9b45b">FORMULA 5</text>
          <text x="20" y="52" font-size="14" font-weight="300" fill="#ccc">"Date night" — rust chunky knit, midi skirt, ankle boots</text>
          <text x="440" y="52" font-size="13" font-weight="400" fill="#d9b45b" text-anchor="end">cozy intentional</text>
        </g>
      </g>
    </g>
    
    <!-- Results stats -->
    <g transform="translate(0, 500)">
      <text x="100" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#d9b45b">2 hrs</text>
      <text x="100" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">PLANNING / YR</text>
      
      <text x="260" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#d9b45b">~$0</text>
      <text x="260" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">IMPULSE SPEND</text>
      
      <text x="420" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#d9b45b">87%</text>
      <text x="420" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555">SPEND DROP</text>
    </g>
  </g>
  
  <!-- Bottom CTA -->
  <text x="600" y="605" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="300" fill="#555">DRIPMATIQ.APP — YOUR CLOSET HAS ANSWERS</text>
</svg>