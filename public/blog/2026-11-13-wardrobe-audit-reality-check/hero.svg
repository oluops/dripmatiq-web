    <text x="260" y="-10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="300" fill="#d9b45b" letter-spacing="2">BEFORE</text>
    
    <!-- 134 items label -->
    <text x="260" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="200" fill="#ffffff" filter="url(#glow)">134</text>
    <text x="260" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#888">TOTAL PIECES</text>
    
    <!-- Chaotic pile visualization -->
    <g transform="translate(0, 90)">
      <!-- Scattered items - represented as varied rectangles -->
      <g fill="#333" stroke="#444" stroke-width="1" opacity="0.6">
        <rect x="40" y="20" width="80" height="100" rx="4" transform="rotate(-8, 80, 70)"/>
        <rect x="180" y="40" width="70" height="90" rx="4" transform="rotate(5, 215, 85)"/>
        <rect x="320" y="10" width="85" height="95" rx="4" transform="rotate(-3, 362.5, 57.5)"/>
        <rect x="60" y="140" width="75" height="105" rx="4" transform="rotate(6, 97.5, 192.5)"/>
        <rect x="200" y="150" width="90" height="100" rx="4" transform="rotate(-4, 245, 200)"/>
        <rect x="340" y="130" width="70" height="110" rx="4" transform="rotate(2, 375, 185)"/>
        <rect x="100" y="270" width="80" height="95" rx="4" transform="rotate(-7, 140, 317.5)"/>
        <rect x="240" y="260" width="85" height="100" rx="4" transform="rotate(4, 282.5, 310)"/>
        <rect x="380" y="250" width="75" height="105" rx="4" transform="rotate(-2, 417.5, 302.5)"/>
      </g>
      
      <!-- Accent pieces in gold (the worn ones) -->
      <g fill="url(#goldGrad)" stroke="#c4a04e" stroke-width="1.5" filter="url(#softGlow)">
        <rect x="80" y="60" width="70" height="95" rx="4" transform="rotate(-2, 115, 107.5)"/>
        <rect x="260" y="180" width="75" height="100" rx="4" transform="rotate(3, 297.5, 230)"/>
        <rect x="140" y="290" width="65" height="90" rx="4" transform="rotate(-1, 172.5, 335)"/>
      </g>
    </g>
    
    <!-- Stats -->
