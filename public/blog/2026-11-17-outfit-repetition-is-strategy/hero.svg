<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Before/after: chaotic 134-item closet with 'nothing to wear' panic vs streamlined 30-piece rotation organized into 8 formulas covering 95% of occasions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#121D35"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F2D27A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4E3F1A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A4E3F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-text" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-left)"/>
  <rect width="1200" height="630" fill="url(#glow-right)"/>
  
  <!-- Top gold accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldline)"/>
  
  <!-- Left side: BEFORE (Chaos) -->
  <rect x="60" y="80" width="510" height="470" rx="16" fill="#0E111B" opacity="0.9" filter="url(#shadow)"/>
  
  <text x="315" y="130" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#F2D27A" text-anchor="middle" letter-spacing="2">BEFORE</text>
  <line x1="160" y1="142" x2="470" y2="142" stroke="url(#goldline)" stroke-width="2" stroke-linecap="round"/>
  
  <text x="315" y="185" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F7F4EC" text-anchor="middle">134 Items. 20 Worn. 114 Invisible.</text>
  <text x="315" y="215" font-family="Inter, Arial, sans-serif" font-size="16" fill="#B8C0D8" text-anchor="middle" opacity="0.8">43 hrs/yr staring at closet • $2,800 impulse buys</text>
  <text x="315" y="240" font-family="Inter, Arial, sans-serif" font-size="16" fill="#B8C0D8" text-anchor="middle" opacity="0.8">Decision fatigue at 7 AM • 3 black sweaters, 1 worn</text>
  
  <!-- Visual: chaotic pile of clothing items -->
  <g transform="translate(315, 350)">
    <!-- Sweater 1 - cream merino (worn) -->
    <ellipse cx="-100" cy="20" rx="45" ry="35" fill="#E8DCC8" stroke="#C9B896" stroke-width="2"/>
    <text x="-100" y="70" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F2D27A" text-anchor="middle" font-weight="600">42 wears ✓</text>
    
    <!-- Sweater 2 - navy cashmere (barely worn) -->
    <ellipse cx="-10" cy="20" rx="45" ry="35" fill="#2D3A4F" stroke="#1A2535" stroke-width="2"/>
    <text x="-10" y="70" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8A9BC0" text-anchor="middle">5 wears</text>
    
    <!-- Sweater 3 - charcoal wool (never worn) -->
    <ellipse cx="80" cy="20" rx="45" ry="35" fill="#3A3A3A" stroke="#2A2A2A" stroke-width="2"/>
    <text x="80" y="70" font-family="Inter, Arial, sans-serif" font-size="12" fill="#F47174" text-anchor="middle" font-weight="600">0 wears ✗</text>
    
    <!-- More items scattered -->
    <ellipse cx="-140" cy="-20" rx="30" ry="40" fill="#1A3A2E" stroke="#0F2A1F" stroke-width="1.5" transform="rotate(-15 -140 -20)"/>
    <ellipse cx="120" cy="-20" rx="30" ry="40" fill="#3D2A1A" stroke="#2D1F10" stroke-width="1.5" transform="rotate(15 120 -20)"/>
    <ellipse cx="-160" cy="60" rx="35" ry="25" fill="#4A3D2A" stroke="#3A2F1F" stroke-width="1.5" transform="rotate(10 -160 60)"/>
    <ellipse cx="160" cy="60" rx="35" ry="25" fill="#2A1A3A" stroke="#1F102A" stroke-width="1.5" transform="rotate(-10 160 60)"/>
    <ellipse cx="-60" cy="100" rx="28" ry="38" fill="#1A2A3A" stroke="#101F2A" stroke-width="1.5"/>
    <ellipse cx="60" cy="100" rx="28" ry="38" fill="#2A3A1A" stroke="#1F2A10" stroke-width="1.5"/>
    
    <!-- Panic text -->
    <text x="0" y="160" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#F47174" text-anchor="middle" filter="url(#glow-text)">"NOTHING TO WEAR"</text>
    <text x="0" y="185" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B8C0D8" text-anchor="middle" opacity="0.7">7 AM panic • decision fatigue • impulse buy #4 black sweater</text>
  </g>
  
  <!-- Right side: AFTER (Formulas) -->
  <rect x="630" y="80" width="510" height="470" rx="16" fill="#0E111B" opacity="0.9" filter="url(#shadow)"/>
  
  <text x="885" y="130" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#7AD4A6" text-anchor="middle" letter-spacing="2">AFTER</text>
  <line x1="730" y1="142" x2="1040" y2="142" stroke="#7AD4A6" stroke-width="2" stroke-linecap="round"/>
  
  <text x="885" y="185" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#F7F4EC" text-anchor="middle">30 Pieces. 8 Formulas. 95% Covered.</text>
  <text x="885" y="215" font-family="Inter, Arial, sans-serif" font-size="16" fill="#B8C0D8" text-anchor="middle" opacity="0.8">2 hrs/yr planning • Near-zero impulse buys</text>
  <text x="885" y="240" font-family="Inter, Arial, sans-serif" font-size="16" fill="#B8C0D8" text-anchor="middle" opacity="0.8">30-sec mornings • Friday review loop</text>
  
  <!-- Visual: 8 formula cards -->
  <g transform="translate(885, 350)">
    <text x="0" y="-110" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7AD4A6" text-anchor="middle">8 FORMULAS FROM WEAR DATA</text>
    
    <!-- Formula cards in a grid -->
    <g transform="translate(-200, -70)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="22" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Client Call Anchor</text>
      <text x="90" y="38" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Blazer + Merino + Denim + Boots</text>
      
      <!-- Card 2 -->
      <rect x="0" y="65" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="87" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">WFH Grocery Run</text>
      <text x="90" y="103" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Tee + Joggers + Sneakers</text>
      
      <!-- Card 3 -->
      <rect x="0" y="130" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="152" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Rain Commute</text>
      <text x="90" y="168" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Trench + Merino + Jeans + Boots</text>
      
      <!-- Card 4 -->
      <rect x="0" y="195" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="217" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Travel Walking</text>
      <text x="90" y="233" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Shell + Tee + Chinos + Sneakers</text>
    </g>
    
    <g transform="translate(20, -70)">
      <!-- Card 5 -->
      <rect x="0" y="0" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="22" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Date Night</text>
      <text x="90" y="38" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Knit + Skirt + Boots</text>
      
      <!-- Card 6 -->
      <rect x="0" y="65" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="87" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Brunch Casual</text>
      <text x="90" y="103" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Cardigan + Tee + Jeans + Loafers</text>
      
      <!-- Card 7 -->
      <rect x="0" y="130" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="152" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Gym Active</text>
      <text x="90" y="168" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Tank + Leggings + Trainers</text>
      
      <!-- Card 8 -->
      <rect x="0" y="195" width="180" height="55" rx="8" fill="#1A3A2E" stroke="#2E7D5A" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="217" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#7AD4A6" text-anchor="middle">Home Lounge</text>
      <text x="90" y="233" font-family="Inter, Arial, sans-serif" font-size="9" fill="#B8C0D8" text-anchor="middle">Oversized Knit + Joggers + Slides</text>
    </g>
    
    <!-- Stats at bottom -->
    <text x="0" y="180" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F2D27A" text-anchor="middle">Cost/wear: $400 blazer → $10 (40 wears) vs $100 (4 wears)</text>
    <text x="0" y="200" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#7AD4A6" text-anchor="middle">Repetition = Strategy. Formulas = Freedom.</text>
  </g>
  
  <!-- Bottom branding -->
  <text x="600" y="590" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#B8C0D8" text-anchor="middle" letter-spacing="3">DRIPMATIQ.APP</text>
  <line x1="500" y1="602" x2="700" y2="602" stroke="url(#goldline)" stroke-width="2" stroke-linecap="round"/>
</svg>