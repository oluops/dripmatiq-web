<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9b45b"/>
      <stop offset="100%" style="stop-color:#f0d48a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Accent line -->
  <line x1="120" y1="180" x2="120" y2="450" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Title -->
  <text x="180" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="200" font-size="52" fill="#ffffff" letter-spacing="-1.5" line-height="1.1">
    <tspan x="180" dy="0">Cost Per Wear:</tspan>
    <tspan x="180" dy="60">The Metric That</tspan>
    <tspan x="180" dy="60">Changes Everything</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="180" y="430" font-family="system-ui, -apple-system, sans-serif" font-weight="300" font-size="22" fill="#b0b0b0" letter-spacing="0.2" line-height="1.4" opacity="0.9">
    Your closet is an asset portfolio. Time to run the numbers.
  </text>
  
  <!-- Visual: spreadsheet rows -->
  <g transform="translate(720, 180)">
    <rect x="0" y="0" width="360" height="280" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    
    <!-- Header row -->
    <rect x="8" y="8" width="344" height="40" rx="4" fill="#1e1e1e"/>
    <text x="20" y="36" font-family="monospace" font-size="12" fill="#d9b45b" font-weight="500">Item</text>
    <text x="180" y="36" font-family="monospace" font-size="12" fill="#d9b45b" font-weight="500" text-anchor="middle">Price</text>
    <text x="280" y="36" font-family="monospace" font-size="12" fill="#d9b45b" font-weight="500" text-anchor="middle">Wears</text>
    <text x="340" y="36" font-family="monospace" font-size="12" fill="#d9b45b" font-weight="500" text-anchor="end">CPW</text>
    
    <!-- Data rows -->
    <g font-family="monospace" font-size="11" fill="#e0e0e0">
      <!-- Winner -->
      <rect x="8" y="56" width="344" height="36" rx="4" fill="rgba(217, 180, 91, 0.08)"/>
      <text x="20" y="82" fill="#d9b45b">Black jeans</text>
      <text x="180" y="82" text-anchor="middle">$98</text>
      <text x="280" y="82" text-anchor="middle">180</text>
      <text x="340" y="82" text-anchor="end" fill="#4ade80" font-weight="600">$0.54</text>
      
      <rect x="8" y="100" width="344" height="36" rx="4" fill="transparent"/>
      <text x="20" y="126" fill="#d9b45b">White turtleneck</text>
      <text x="180" y="126" text-anchor="middle">$40</text>
      <text x="280" y="126" text-anchor="middle">92</text>
      <text x="340" y="126" text-anchor="end" fill="#4ade80" font-weight="600">$0.43</text>
      
      <rect x="8" y="144" width="344" height="36" rx="4" fill="transparent"/>
      <text x="20" y="170" fill="#d9b45b">Leather loafers</text>
      <text x="180" y="170" text-anchor="middle">$165</text>
      <text x="280" y="170" text-anchor="middle">140</text>
      <text x="340" y="170" text-anchor="end" fill="#4ade80" font-weight="600">$1.18</text>
      
      <!-- Loser -->
      <rect x="8" y="188" width="344" height="36" rx="4" fill="rgba(239, 68, 68, 0.08)"/>
      <text x="20" y="214" fill="#ef4444">Sequin top</text>
      <text x="180" y="214" text-anchor="middle">$65</text>
      <text x="280" y="214" text-anchor="middle">0</text>
      <text x="340" y="214" text-anchor="end" fill="#ef4444" font-weight="600">∞</text>
      
      <rect x="8" y="232" width="344" height="36" rx="4" fill="transparent"/>
      <text x="20" y="258" fill="#ef4444">Cutout dress</text>
      <text x="180" y="258" text-anchor="middle">$89</text>
      <text x="280" y="258" text-anchor="middle">1</text>
      <text x="340" y="258" text-anchor="end" fill="#ef4444" font-weight="600">$89.00</text>
    </g>
  </g>
  
  <!-- Brand -->
  <text x="1080" y="600" font-family="system-ui, -apple-system, sans-serif" font-weight="200" font-size="28" fill="#d9b45b" text-anchor="end" letter-spacing="2">
    DRIPMATIQ
  </text>
  <text x="1080" y="620" font-family="system-ui, -apple-system, sans-serif" font-weight="300" font-size="11" fill="#666" text-anchor="end" letter-spacing="1">
    OUTFITS YOU ALREADY OWN
  </text>
</svg>