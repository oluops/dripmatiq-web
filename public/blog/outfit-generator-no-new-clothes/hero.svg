<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Outfit Generator No New Clothes hero image</title>
  <desc id="desc">Dark background showing phone with outfit combinations generated from user's digital wardrobe, zero shopping links</desc>

  <!-- Simple background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Atmospheric circles -->
  <circle cx="200" cy="200" r="100" fill="#06B6D4" opacity="0.25"/>
  <circle cx="950" cy="280" r="120" fill="#3B82F6" opacity="0.25"/>
  <circle cx="550" cy="500" r="90" fill="#F59E0B" opacity="0.25"/>

  <!-- Phone frame -->
  <rect x="180" y="60" width="360" height="640" rx="40" fill="#0F172A" stroke="#334155" stroke-width="3"/>
  <rect x="210" y="90" width="300" height="580" rx="24" fill="#020617"/>

  <!-- Phone top bar -->
  <rect x="230" y="110" width="260" height="40" rx="8" fill="#111827" stroke="#374151"/>
  <rect x="240" y="118" width="80" height="24" rx="12" fill="#06B6D4" opacity="0.3"/>
  <text x="360" y="134" fill="#7C3AED" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Dripmatiq</text>

  <!-- Outfit cards in phone -->
  <g fill="#111827" stroke="#374151">
    <!-- Card 1 -->
    <rect x="230" y="170" width="260" height="140" rx="16"/>
    <rect x="245" y="185" width="80" height="80" rx="10" fill="#06B6D4" opacity="0.3"/>
    <text x="360" y="285" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Look 1</text>
    <text x="360" y="302" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Tee + Jeans + Blazer</text>

    <!-- Card 2 -->
    <rect x="230" y="330" width="260" height="140" rx="16"/>
    <rect x="245" y="345" width="80" height="80" rx="10" fill="#F59E0B" opacity="0.3"/>
    <text x="360" y="445" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Look 2</text>
    <text x="360" y="462" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Knit + Trousers + Loafers</text>

    <!-- Card 3 -->
    <rect x="230" y="490" width="260" height="140" rx="16" stroke="#22C55E" stroke-width="2"/>
    <rect x="245" y="505" width="80" height="80" rx="10" fill="#22C55E" opacity="0.3"/>
    <text x="360" y="605" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Look 3 ✓</text>
    <text x="360" y="622" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Dress + Boots + Coat</text>
  </g>

  <!-- No shopping badge -->
  <rect x="240" y="645" width="240" height="28" rx="14" fill="#EF4444" opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="360" y="665" fill="#EF4444" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛑 Zero Shopping Links</text>

  <!-- Dashboard panel -->
  <rect x="600" y="80" width="520" height="470" rx="20" fill="#0F172A" stroke="#334155"/>
  <rect x="620" y="100" width="480" height="430" rx="14" fill="#020617"/>

  <!-- Dashboard header -->
  <text x="650" y="140" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Outfit Generator</text>
  <text x="650" y="168" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="13">From your closet only</text>

  <!-- Weather chips -->
  <g>
    <rect x="640" y="190" width="80" height="28" rx="14" fill="#0EA5E9" opacity="0.25"/>
    <text x="680" y="211" fill="#0EA5E9" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle">72°F</text>

    <rect x="730" y="190" width="80" height="28" rx="14" fill="#22C55E" opacity="0.25"/>
    <text x="770" y="211" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Sunny</text>

    <rect x="820" y="190" width="100" height="28" rx="14" fill="#7C3AED" opacity="0.25"/>
    <text x="870" y="211" fill="#A78BFA" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Work</text>
  </g>

  <!-- Generated outfit grid -->
  <g>
    <!-- Row 1 -->
    <rect x="640" y="240" width="140" height="160" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="655" y="255" width="110" height="110" rx="8" fill="#06B6D4" opacity="0.2"/>
    <text x="710" y="385" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Mon</text>
    <text x="710" y="402" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">3 combos</text>

    <rect x="800" y="240" width="140" height="160" rx="12" fill="#111827" stroke="#374151"/>
    <rect x="815" y="255" width="110" height="110" rx="8" fill="#F59E0B" opacity="0.2"/>
    <text x="870" y="385" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tue</text>
    <text x="870" y="402" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">3 combos</text>

    <rect x="960" y="240" width="140" height="160" rx="12" fill="#111827" stroke="#22C55E" stroke-width="2"/>
    <rect x="975" y="255" width="110" height="110" rx="8" fill="#22C55E" opacity="0.2"/>
    <text x="1030" y="385" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Wed ✓</text>
    <text x="1030" y="402" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">Saved</text>
  </g>

  <!-- Stats bar -->
  <rect x="640" y="430" width="460" height="80" rx="12" fill="#111827" stroke="#374151"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="680" y="462" fill="#F9FAFB" font-size="24" font-weight="700" text-anchor="middle">47</text>
    <text x="680" y="482" fill="#9CA3AF" font-size="11" text-anchor="middle">Outfits this week</text>

    <text x="860" y="462" fill="#F9FAFB" font-size="24" font-weight="700" text-anchor="middle">0</text>
    <text x="860" y="482" fill="#9CA3AF" font-size="11" text-anchor="middle">New items needed</text>

    <text x="1040" y="462" fill="#F9FAFB" font-size="24" font-weight="700" text-anchor="middle">$0</text>
    <text x="1040" y="482" fill="#9CA3AF" font-size="11" text-anchor="middle">Spent</text>
  </g>

  <!-- Brand underline -->
  <rect x="80" y="605" width="180" height="3" rx="1.5" fill="#7C3AED"/>
  <text x="80" y="625" fill="#7C3AED" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">DRIPMATIQ</text>
</svg>